server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml image/png;
    gzip_min_length 1024;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                            always;
    add_header X-Frame-Options         "DENY"                               always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' mc.yandex.ru; img-src 'self' mc.yandex.ru data:; connect-src 'self' mc.yandex.ru; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self';" always;

    location ~* \.(css|js|json|woff2?|png|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(git|env|htaccess) { deny all; return 404; }
    location ^~ /scripts/ { deny all; return 404; }
}
